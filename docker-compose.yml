services:
  oncobot:
    # We use the ECR URI variable here
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: oncobot-container
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # chroma_db is persisted across container restarts so we don't have to
      # re-index from scratch every time.  It is NOT baked into the image
      # (chroma_db/ is in .dockerignore); on first startup the background
      # indexer reads knowledge_base/ (baked in via COPY . .) and populates
      # this volume automatically.
      - ./oncobot_data/chroma_db:/app/chroma_db
      # NOTE: knowledge_base/ is intentionally NOT mounted as a volume.
      # The XML files are baked into the image via 'COPY . .' in the Dockerfile.
      # Mounting a host directory here would shadow the baked-in files with an
      # empty directory on a fresh EC2 host, causing RAG to stay empty forever.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}