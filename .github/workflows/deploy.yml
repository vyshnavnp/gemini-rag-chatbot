name: Deploy OncoBot to AWS ECR

on:
  push:
    branches: ["main"]

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: latest
      run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

    - name: Scan image for critical vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
        exit-code: '1'
        severity: 'CRITICAL'

    - name: Push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: latest
      run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Copy docker-compose.yml to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.yml"
        target: "/home/ubuntu/"

    - name: SSH into EC2 and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        script: |
          export PATH=$PATH:/snap/bin
          export AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}
          export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}

          # 0. Expand EBS volume if it is smaller than 20 GB
          INSTANCE_ID=$(ec2metadata --instance-id 2>/dev/null || curl -s http://169.254.169.254/latest/meta-data/instance-id)
          VOLUME_ID=$(aws ec2 describe-volumes \
            --filters Name=attachment.instance-id,Values=$INSTANCE_ID \
            --query 'Volumes[0].VolumeId' --output text)
          CURRENT_SIZE=$(aws ec2 describe-volumes \
            --volume-ids $VOLUME_ID \
            --query 'Volumes[0].Size' --output text)
          if [ "$CURRENT_SIZE" -lt 20 ]; then
            echo "Expanding EBS volume $VOLUME_ID from ${CURRENT_SIZE}GB to 20GB..."
            aws ec2 modify-volume --volume-id $VOLUME_ID --size 20
            sleep 10
            # Grow the partition and filesystem
            sudo growpart /dev/xvda 1 2>/dev/null || sudo growpart /dev/nvme0n1p1 1 2>/dev/null || true
            sudo resize2fs /dev/xvda1 2>/dev/null || sudo resize2fs /dev/nvme0n1p1 2>/dev/null || true
          fi

          # 1. Login
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

          # 2. Update .env file
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}" >> .env
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> .env

          # 3. Ensure the chroma_db volume dir exists and is owned by ubuntu (UID 1000)
          #    so the non-root container user (appuser, also UID 1000) can write to it.
          mkdir -p oncobot_data/chroma_db

          # 4. NUKE THE OLD CONTAINER & IMAGE (Crucial Step)
          docker compose down --volumes || true
          docker system prune -a -f --volumes
          docker builder prune -a -f
          df -h

          # 4. Pull and Start
          docker compose pull
          docker compose up -d